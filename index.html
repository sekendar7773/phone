<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>প্যারেন্টাল কন্ট্রোল প্যানেল</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background-color: #f4f4f9; }
        .card { background: white; padding: 30px; border-radius: 10px; display: inline-block; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); }
        h2 { color: #333; }
        button { padding: 15px 30px; font-size: 18px; cursor: pointer; border: none; border-radius: 5px; color: white; margin-top: 20px; }
        .lock { background-color: #d9534f; }
        .unlock { background-color: #5cb85c; }
        #status { font-weight: bold; font-size: 20px; margin: 15px 0; }
    </style>
</head>
<body>

    <div class="card">
        <h2>সন্তানের ফোন কন্ট্রোল প্যানেল</h2>
        <p>পড়ার সময় ফোন লক বা আনলক করতে নিচের সুইচ ব্যবহার করুন:</p>
        
        <div id="status">বর্তমান অবস্থা: লোডিং...</div>

        <button class="lock" onclick="updateStatus('LOCK')">ফোন লক করুন (পড়ার সময়)</button>
        <br>
        <button class="unlock" onclick="updateStatus('UNLOCK')">ফোন আনলক করুন (অবসর সময়)</button>
    </div>

    <script>
        // এটি একটি ফ্রি ডেমো এপিআই (JSONBin বা আপনার নিজস্ব সার্ভার লিংক এখানে যুক্ত হবে)
        const API_URL = "https://api.jsonbin.io/v3/b/YOUR_BIN_ID_HERE";
        const API_KEY = "YOUR_MASTER_KEY_HERE";

        async function checkStatus() {
            try {
                let response = await fetch(API_URL, {
                    headers: { 'X-Master-Key': API_KEY }
                });
                let data = await response.json();
                let current = data.record.status;
                
                document.getElementById("status").innerText = "স্ট্যাটাস: " + (current === "LOCK" ? "🔴 লক করা (গেম বন্ধ)" : "🟢 সচল (ব্যবহার করা যাবে)");
                document.getElementById("status").style.color = current === "LOCK" ? "red" : "green";
            } catch (err) {
                console.error(err);
            }
        }

        async function updateStatus(newStatus) {
            try {
                let response = await fetch(API_URL, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': API_KEY
                    },
                    body: JSON.stringify({ status: newStatus })
                });
                if(response.ok) {
                    alert("সফলভাবে স্ট্যাটাস পরিবর্তন করা হয়েছে: " + newStatus);
                    checkStatus();
                }
            } catch (err) {
                alert("ত্রুটি হয়েছে: " + err);
            }
        }

        // পেজ লোড হলে চেক করবে
        checkStatus();
    </script>

</body>
</html>
